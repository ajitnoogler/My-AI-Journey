def topo(n, edges):
    adj, indeg = [[] for _ in range(n)], [0] * n
    for a, b in edges: adj[a].append(b); indeg[b] += 1
    q, out = deque(i for i in range(n) if not indeg[i]), []

const EX={
"Reverse string and palindrome":"Slicing with [::-1] reverses the string. A palindrome equals its own reverse, so lower-case first to ignore case. O(n).",
"Valid anagram":"Two words are anagrams if every letter appears the same number of times. Counter builds and compares the counts. O(n).",
"First non-repeating character":"Count every character once, then scan the string again and return the first one whose count is 1. O(n).",
"Two Sum":"Store each value with its index in a dict. For each number, check if target minus number was already seen. One pass, O(n) time and space.",
"Valid parentheses":"Push openers on a stack. Each closer must match the most recent opener. The string is valid only if the stack ends empty. O(n).",
"Longest substring without repeating chars":"Sliding window with a last-seen index per character. When a repeat appears inside the window, move the left edge just past it. O(n).",
"Maximum subarray (Kadane)":"At each element, either extend the running sum or restart from this element. Track the best sum seen. O(n) time, O(1) space.",
"Merge intervals":"Sort by start. If the next interval starts before the last one ends, extend the last end, else append a new interval. O(n log n).",
"Move zeroes in place":"Pointer k marks the next slot for a non-zero value. Swap each non-zero element into it. Order is kept, no extra list. O(n).",
"Product of array except self":"Pass 1 stores the product of everything to the left, pass 2 multiplies in everything to the right. No division, so zeros are safe. O(n).",
"Rotate list by k and common prefix":"Rotation is the last k items placed in front of the rest. os.path.commonprefix finds the shared leading characters of strings. O(n).",
"3Sum":"Sort, fix one number, then use two pointers on the rest to find pairs that cancel it. Skip duplicates so triplets are unique. O(n^2).",
"Container with most water":"Two pointers at both ends. Area depends on the shorter wall, so move the shorter side inward to try for a taller one. O(n).",
"Flatten nested list":"A recursive generator. If an item is a list, delegate to it with yield from, else yield the value. Handles any depth lazily.",
"Rotate matrix 90 degrees":"Reverse the row order, then transpose with zip(*). Together these give a clockwise rotation. O(n^2).",
"Fibonacci":"Keep only the last two values and update them in a loop. Avoids the exponential cost of plain recursion. O(n) time, O(1) space.",
"Sieve of Eratosthenes":"Assume all numbers are prime, then for each prime cross out its multiples starting at its square. O(n log log n).",
"GCD and LCM":"math.gcd uses Euclid algorithm. LCM follows from a * b / gcd(a, b).",
"Armstrong number":"A number equals the sum of its digits each raised to the number of digits. 153 = 1^3 + 5^3 + 3^3.",
"Set bits and power of two":"bin(n).count of 1 counts set bits. n & (n - 1) clears the lowest set bit, so a power of two (exactly one bit) gives 0.",
"FizzBuzz":"Build the word by string concatenation. An empty string is falsy, so the or falls back to the number itself. O(n).",
"Group anagrams":"Words with the same sorted letters are anagrams, so the sorted word is the dict key. O(n * k log k) for k-letter words.",
"Top K frequent elements":"Counter tallies frequencies and most_common(k) returns the k largest. About O(n log k).",
"Longest consecutive sequence":"Put numbers in a set. Only start counting from a number with no predecessor, so each run is walked once. O(n).",
"Subarray sum equals K":"Keep a running prefix sum and a count of earlier prefix sums. Any earlier prefix equal to total minus k ends a valid subarray. O(n).",
"LRU cache":"OrderedDict keeps usage order. move_to_end marks a key as recent and popitem(last=False) evicts the oldest. get and put are O(1).",
"Missing number and duplicates":"Missing number: expected sum n(n+1)/2 minus actual sum. Duplicates: values seen more than once. count() makes this O(n^2), use Counter or a set for O(n).",
"Reverse a linked list":"Walk the list and flip each next pointer to the previous node. O(n) time, O(1) space.",
"Detect cycle (Floyd)":"A slow pointer moves 1 step and a fast one moves 2. If there is a loop they meet, else fast reaches the end. O(n), O(1) space.",
"Merge sorted lists":"heapq.merge lazily merges already sorted inputs. In interviews you may need to splice nodes with two pointers. O(n + m).",
"Min stack":"Store each value together with the minimum so far. Then push, pop and get_min are all O(1).",
"Queue using two stacks":"Push to the input stack. When popping and the output stack is empty, move everything over, which reverses order into FIFO. Amortized O(1).",
"Tree depth and inorder":"Depth is 1 plus the deeper child. Inorder visits left, node, right, which gives sorted order for a BST. O(n).",
"Validate BST":"Pass an allowed (low, high) range down the tree. Each node must fall inside it. Comparing only with the parent is a common bug. O(n).",
"Level order traversal (BFS)":"Process a queue one whole level at a time, collecting the children for the next level. O(n).",
"Number of islands (DFS)":"Scan the grid. On each unvisited land cell, flood-fill it with DFS to sink the whole island and count one. O(rows * cols).",
"Dijkstra shortest path":"A min-heap always pops the closest unfinished node, then relaxes its edges. Needs non-negative weights. O((V + E) log V).",
"Topological sort (Kahn)":"Start with nodes of in-degree 0, remove them and lower neighbors in-degree. If fewer than n nodes come out, there is a cycle. O(V + E).",
"Binary search":"Halve the search range each step by comparing with the middle. Input must be sorted. O(log n).",
"Merge sort":"Split in half, sort each half, merge. Stable and always O(n log n). pop(0) is slow here, use indexes in production code.",
"Quick sort":"Pick a pivot and split into smaller, equal and larger parts, then recurse. Average O(n log n), worst O(n^2). This version is not in place.",
"Kth largest element (heap)":"nlargest keeps a heap of size k, so the kth largest is the last result. O(n log k).",
"Search in rotated sorted array":"At each step one half is still sorted. Check whether the target lies in that half and discard the other. O(log n).",
"Climbing stairs":"Ways to reach step n equals ways to n-1 plus ways to n-2, which is Fibonacci. O(n) time, O(1) space.",
"Coin change":"dp[a] is the fewest coins for amount a, built from dp[a - coin] + 1. Returns -1 if impossible. O(amount * coins).",
"Longest common subsequence":"dp[i][j] extends the diagonal on a match, else takes the better of the top or left cell. O(n * m).",
"0/1 Knapsack":"1D dp over capacity. Loop capacity backwards so each item is used at most once. O(items * capacity).",
"Permutations and subsets":"itertools generates them directly. Interviewers often want the backtracking version. Sizes are n! and 2^n.",
"Longest increasing subsequence":"Keep a tails array and place each number with bisect, replacing the first tail that is not smaller. Length of tails is the answer. O(n log n).",
"Edit distance":"dp over prefixes: insert, delete or replace costs 1, a match costs 0. One rolling row saves memory. O(n * m).",
"Mutable default argument trap":"A default list is created once when the function is defined, so every call shares it. Use None as the default and create the list inside.",
"Shallow vs deep copy":"copy.copy duplicates only the outer list, so nested lists are still shared. deepcopy duplicates everything.",
"is vs == and None check":"== compares values, is compares object identity. Use is None for None checks.",
"Late binding in closures":"A lambda looks up i when it is called, after the loop ended. Bind the current value with a default argument i=i.",
"Decorator with arguments":"Three layers: repeat(n) returns the decorator, which returns the wrapper. functools.wraps keeps the original name and docstring.",
"Generator vs list memory":"A generator produces values lazily so it uses tiny constant memory. A list stores every item at once.",
"GIL: threads vs processes":"The GIL lets one thread run Python bytecode at a time. CPU-bound work needs processes, I/O-bound work is fine with threads or asyncio.",
"Parse log, top error IP":"Filter lines whose status starts with 5, then count by IP with Counter and take the top. O(n).",
"IPv4 and CIDR validation":"The ipaddress module validates addresses, checks is_private, and tests membership in a network. Better than hand-written regex.",
"Longest prefix match for routes":"Collect every route that contains the IP and pick the longest prefix length, which is how routers choose. Large tables use a trie.",
"Token bucket rate limiter":"Tokens refill at a fixed rate up to a cap. A request is allowed if a token is available, which permits short bursts.",
"Producer and consumer with Queue":"queue.Queue is thread-safe and the maxsize gives backpressure. None is a sentinel telling the consumer to stop.",
"Retry decorator with backoff":"Wait 0.5s, 1s, 2s between attempts and re-raise on the last one. Add random jitter in production to avoid retry storms.",
"Word frequency from a file":"Regex extracts lower-cased words and Counter tallies them. For huge files, read in chunks or line by line.",
"SQL with sqlite3 (group, having)":"GROUP BY aggregates per department and HAVING filters the groups after aggregation. Parameterized inserts prevent SQL injection.",
"Singleton":"__new__ returns the same instance every time. A module-level object is often the simpler Python answer.",
"Bank account with custom exception":"A custom exception gives a meaningful error. Validate before changing state so the balance is never corrupted.",
"Parking lot":"A list of free slots plus a plate to slot map. park pops a free slot and leave returns it. Use deque for O(1) pops.",
"Event emitter (observer)":"A dict maps event names to handler lists, and emit calls each handler. This is the base of pub/sub designs.",
"Validate date with datetime.strptime":"strptime raises ValueError for impossible dates, including Feb 29 in non-leap years and month 13, so try/except is a full validator. This is the answer to give first.",
"Validate date without libraries":"Check the month is 1 to 12, then the day against a days-per-month list where February depends on the leap rule (divisible by 400, or by 4 but not 100). O(1).",
"Validate dd/mm/yyyy with regex":"Regex checks only the shape (two digits, two digits, four digits). The date() constructor then checks that the day exists. Never rely on regex alone for dates.",
"Parse multiple date formats":"Try each format in turn and return the first that parses. Note that dd/mm and mm/dd are ambiguous for dates like 03/04/2024, so the order of formats decides the result.",
"Day of week and days between dates":"Subtracting two date objects gives a timedelta, and .days is the gap. strftime with %A gives the weekday name.",
"Add business days":"Step one day at a time and count only weekdays (weekday() below 5). Holidays are not handled, a real version needs a holiday set.",
"Age from date of birth":"Subtract the years, then subtract 1 if this year birthday has not happened yet. The tuple comparison (month, day) does that check neatly.",
"Timezone conversion with zoneinfo":"Attach a timezone to the datetime, then astimezone converts it and handles daylight saving automatically. Store times in UTC and convert only for display."
};
