<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python Lab for AI FDE Engineers</title>
<style>
:root{--bg:#0a0f22;--pn:#101936;--tx:#e8ebff;--mu:#8d97c0;--ac:#9ec5ff;--bl:#8ec5ff;--bd:#1e2a57;--cb:transparent;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f22;--pn:#101936;--tx:#e8ebff;--mu:#8d97c0;--ac:#9ec5ff;--bl:#8ec5ff;--bd:#1e2a57;--cb:transparent}}
:root[data-theme="light"]{--bg:#eef2fb;--pn:#fff;--tx:#0b1020;--mu:#55618a;--ac:#2563eb;--bl:#1d4ed8;--bd:#d0d9f0;--cb:#f3f6fd}
:root[data-theme="dark"]{--bg:#0a0f22;--pn:#101936;--tx:#e8ebff;--mu:#8d97c0;--ac:#9ec5ff;--bl:#8ec5ff;--bd:#1e2a57;--cb:transparent}
*{box-sizing:border-box}html{scroll-padding-top:90px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
aside{position:fixed;top:env(safe-area-inset-top,0px);bottom:0;left:0;width:250px;padding:18px 14px;overflow:auto;border-right:1px solid var(--bd);background:var(--pn)}
aside h1{font-size:18px;margin:0 0 4px}aside small{color:var(--mu)}
aside a{display:flex;justify-content:space-between;gap:6px;padding:7px 10px;margin-top:2px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:14px}
aside a:hover,aside a.on{background:var(--bd)}aside a b{color:var(--bl);margin-right:6px}aside a i{font-style:normal;color:var(--mu);font-size:12px}
main{margin-left:250px;padding:0 22px 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top input{flex:1;min-width:200px;padding:11px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--pn);color:var(--tx);font-size:15px}
button{cursor:pointer;border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:10px;padding:9px 14px;font-size:14px}
button:hover{border-color:var(--ac)}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;flex-basis:100%}.bar div{height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--bl));transition:width .3s}
.st{color:var(--mu);font-size:13px}
h2{margin:26px 0 10px;font-size:20px}h2 span{color:var(--bl)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:14px}
.c{background:var(--pn);border:1px solid var(--bd);border-radius:14px;overflow:hidden;min-width:0}
.c.d{border-color:var(--ac)}
.h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--bd)}
.h b{color:var(--mu);font-weight:600}.h strong{flex:1}
.h button{padding:5px 10px;font-size:13px}.h .cp{background:#18244f;color:#e8ebff;border-color:#2b3a72}:root[data-theme="light"] .h .cp{background:#e6ecff;color:#0b1020;border-color:var(--bd)}.h .dn{color:var(--ac)}
pre{margin:0;padding:14px;background:var(--cb);color:var(--tx);overflow-x:auto;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;tab-size:4}
.none{padding:40px;text-align:center;color:var(--mu)}
@media(max-width:820px){aside{position:static;width:auto;border:0;border-bottom:1px solid var(--bd);display:flex;gap:6px;overflow-x:auto;padding:10px}aside h1,aside small{display:none}aside a{white-space:nowrap}aside a i{display:none}main{margin:0;padding:0 12px 30px}.top{position:static}}
</style>
</head>
<body>

<button id="all">Show all</button><button id="th">Light / Dark</button>
<span class="st" id="cnt"></span>
<div class="bar"><div id="pb"></div></div>
</div>
<div id="out"></div>
</main>

["Decorator (timing)",r`import time, functools

["Top-k retrieval (RAG core)",r`import numpy as np
def top_k(q_vec, doc_vecs, docs, k=3):
    sims = doc_vecs @ q_vec / (np.linalg.norm(doc_vecs, axis=1) * np.linalg.norm(q_vec))
    return [docs[i] for i in np.argsort(-sims)[:k]]`],

];
const $=s=>document.querySelector(s),out=$("#out"),links=$("#links");
let done={};try{done=JSON.parse(localStorage.getItem("pyfde")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("pyfde",JSON.stringify(done))}catch(e){}};
const total=M.reduce((a,m)=>a+m[1].length,0);
function render(){
  const q=$("#q").value.trim().toLowerCase();let shown=0;out.innerHTML="";
  M.forEach((m,mi)=>{
    const items=m[1].map((p,pi)=>[p,pi]).filter(([p])=>!q||(p[0]+p[1]+m[0]).toLowerCase().includes(q));
    if(!items.length)return;
    const h=document.createElement("h2");h.id="m"+mi;h.innerHTML="<span>"+String(mi+1).padStart(2,"0")+"</span> ";h.append(m[0]);out.append(h);
    const g=document.createElement("div");g.className="g";
    items.forEach(([p,pi])=>{
      shown++;const k=mi+"-"+pi,c=document.createElement("div");c.className="c"+(done[k]?" d":"");
      c.innerHTML='<div class="h"><b></b><strong></strong><button class="dn"></button><button class="cp">Copy code</button></div><pre></pre>';
      c.querySelector("b").textContent="#"+(pi+1);c.querySelector("strong").textContent=p[0];c.querySelector("pre").textContent=p[1];
      const dn=c.querySelector(".dn");dn.textContent=done[k]?"Done":"Mark done";
      dn.onclick=()=>{done[k]=!done[k];if(!done[k])delete done[k];save();render()};
      c.querySelector(".cp").onclick=e=>{navigator.clipboard.writeText(p[1]).then(()=>{e.target.textContent="Copied";setTimeout(()=>e.target.textContent="Copy code",1200)}).catch(()=>{})};
      g.append(c)});
    out.append(g)});
  if(!shown)out.innerHTML='<div class="none">No programs match your search.</div>';
  $("#cnt").textContent=shown+" programs shown";
  const dc=Object.keys(done).length;$("#pb").style.width=(100*dc/total)+"%";
  links.innerHTML="";
  M.forEach((m,mi)=>{const a=document.createElement("a"),n=m[1].filter((_,pi)=>done[mi+"-"+pi]).length;
    a.href="#m"+mi;a.innerHTML="<span><b>"+String(mi+1).padStart(2,"0")+"</b></span><i>"+n+"/"+m[1].length+"</i>";
    a.firstChild.append(m[0]);links.append(a)});
}
$("#q").oninput=render;
$("#all").onclick=()=>{$("#q").value="";render();scrollTo(0,0)};
$("#th").onclick=()=>{const d=document.documentElement,dark=d.dataset.theme!=="light";d.dataset.theme=dark?"light":"dark"};
render();
</script>
